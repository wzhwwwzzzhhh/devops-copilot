server:
  port: 8080

spring:
  application:
    name: devops-copilot
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:devops_copilot}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 5

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: qwen2.5
      embedding:
        enabled: false
        options:
          model: bge-m3

knowledge:
  es:
    uris: ${ES_URIS:http://localhost:9200}
    index: devops-knowledge

---
spring:
  config:
    activate:
      on-profile: dev

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat:
    model: ${OLLAMA_CHAT_MODEL:qwen2.5}
    temperature: 0.7
    max-tokens: 2048
  embedding:
    model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    temperature: 0.0
    max-tokens: 512
  reasoning:
    model: ${OLLAMA_REASONING_MODEL:deepseek-r1:7b}
    temperature: 0.6
    max-tokens: 4096

logging:
  level:
    com.devboss: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat:
    model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
    temperature: 0.5
    max-tokens: 4096
  embedding:
    model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    temperature: 0.0
    max-tokens: 512
  reasoning:
    model: ${OLLAMA_REASONING_MODEL:deepseek-r1:14b}
    temperature: 0.5
    max-tokens: 8192
